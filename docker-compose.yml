# docker-compose.yml
#
# Phase J dev stack: the running game server.
#
# Topology:
#   mysql  -- holds net7 (content) and net7_user (accounts)
#   server -- the C++ Net-7 game server, talks to mysql
#   login  -- Net7SSL TCP auth server, talks to mysql (Phase J WIP)
#
# Postgres + pgloader live behind the `postgres` profile and are the
# long-term Phase C target (mysqlclient -> libpqxx port). MySQL is the
# short path because the 2010 dumps + the embedded SQL are MySQL-native.

name: ${COMPOSE_PROJECT_NAME:-enb-emulator}

services:
  mysql:
    # mysql:8.0 is the closest LTS to what the 2010 codebase was written
    # against. Strict-mode is loosened via command flags so 2010-vintage
    # INSERTs don't fail on default values / implicit conversions.
    #
    # Phase N (libpqxx) made Postgres the canonical backend, so MySQL is
    # behind a profile now. Bring it up with:
    #   docker compose --profile mysql-legacy up mysql
    # for inspecting the 2010 schema as a reference for ongoing
    # Postgres-side conversion work.
    profiles: ["mysql-legacy"]
    image: mysql:8.0
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --default-authentication-plugin=mysql_native_password
      - --innodb-flush-log-at-trx-commit=2
    environment:
      MYSQL_ROOT_PASSWORD: net7root
      MYSQL_USER: net7
      MYSQL_PASSWORD: net7
      # Pre-create something so the mysql image is happy; the real DBs
      # are created by 00-create-databases.sql in init/.
      MYSQL_DATABASE: _bootstrap
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./db/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./db/mysql:/dumps:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-unet7", "-pnet7"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  server:
    build:
      # Phase R: build context is the repo root so the Dockerfile can
      # COPY common/ (shared protocol headers + net7ipc::PosixIpc) in
      # addition to server/.
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      # Phase N: server speaks Postgres via libpqxx, not MySQL. The mysql
      # service is kept around behind the `mysql-legacy` profile for
      # contributors who want to inspect the original 2010 schema; the
      # server itself does NOT depend on it.
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      # Phase J: the login container's entrypoint chmod's the shared
      # /run/net7-ipc volume to 0777 (server runs as net7:net7 uid 999
      # and otherwise can't bind a datagram socket in the root-owned
      # volume dir). Start order matters; wait for login to be up.
      login:
        condition: service_started
    environment:
      # Net7Config.cfg is the file the server actually reads on boot
      # (server/src/Net7.cpp:124). We mount one in via volumes:.
      TZ: UTC
      # The server spawns ~392 threads (2-3 per sector), and glibc malloc
      # gives each thread its own arena (cap 8 x ncores), each retaining
      # freed memory. Measured: capping arenas at 2 cuts settled RSS from
      # ~975MiB to ~910MiB (~65MiB) with no functional change. Concurrency
      # here is tiny, so the arena-contention tradeoff is irrelevant.
      MALLOC_ARENA_MAX: "2"
      # Phase AI Stage 2 idle-sector teardown tuning (ServerManager.cpp). A space
      # sector continuously empty past TEARDOWN_MS is parked (threads stopped,
      # deferred objects freed) and restarted on next entry; POLL_MS bounds how
      # often the idle scan runs. Both default to 5 min; override from the host
      # env (e.g. NET7_SECTOR_IDLE_TEARDOWN_MS=15000 for a fast teardown test).
      NET7_SECTOR_IDLE_POLL_MS: "${NET7_SECTOR_IDLE_POLL_MS:-300000}"
      NET7_SECTOR_IDLE_TEARDOWN_MS: "${NET7_SECTOR_IDLE_TEARDOWN_MS:-300000}"
    # The server resolves g_DomainName via gethostbyname(); in docker we
    # remap local.net-7.org to the container's loopback so it succeeds
    # without external DNS.
    extra_hosts:
      - "local.net-7.org:127.0.0.1"
    volumes:
      - ./deploy/Net7Config.cfg:/app/Net7Config.cfg:ro
      # SSL_Listener.cpp:56-57 reads "<g_DomainName>.cer" and "<g_DomainName>.pem"
      # from CWD. Certs are generated into deploy/certs by `just gen-certs`.
      - ./deploy/certs/localhost.cer:/app/localhost.cer:ro
      - ./deploy/certs/localhost.pem:/app/localhost.pem:ro
      # SERVER_DATABASE_PATH (Net7.h:143) = "../database/" relative to CWD.
      # With WORKDIR=/app, that resolves to /database/.
      - ./server/data:/database:ro
      # Phase J IPC: AF_UNIX SOCK_DGRAM peer sockets live here. The login
      # service mounts the same named volume so the two processes can see
      # each other's sockets without going through the network.
      - net7-ipc:/run/net7-ipc
    ports:
      # Net-7 listens on:
      # - 3501-3800 UDP (per-sector UDP_Connection, allocated dynamically
      #   by SectorManager::BeginSectorThread via GetSectorPort(); starts
      #   from SECTOR_SERVER_PORT=3501 and increments). The proxy receives
      #   the chosen sector UDP port in the 0x2009 MASTER_HANDOFF_CONFIRM
      #   reply and sends sector traffic there for the rest of the
      #   session. Without exposing this range, the proxy's
      #   ForwardClientOpcode datagrams (LOGIN, START_ACK, position
      #   updates, ...) drop on the docker NAT and the sector instance
      #   idle-times-out the player.
      # - 3808 UDP (master <-> proxy)
      # Note: 3801 (master) and 3805 (global) are owned by the `proxy`
      # service (Net7Proxy), not this server. The server reaches the
      # proxy over the same docker network when needed.
      - "3501-3800:3501-3800/udp"
      - "3808:3808/udp"
      # MVAS_LOGIN_PORT — move-assist position channel. Normally proxy<->server
      # only (the proxy scrapes the Win32 client's engine position and relays
      # it here). Published so the headless CLI can act as a full UDP client:
      # it feeds its own position here and, because the server routes a
      # player's sector stream back from this port to whoever last sent MVAS
      # (SetPlayerPortIP), it then receives the live sector fanout here too.
      - "3806:3806/udp"
      # Phase K: UDP_GLOBAL_SERVER_PORT — proxy<->server "global" control
      # plane (ticket validation, avatar list, char create/delete). Was TCP
      # via SSL_LOCALCERT_LOGIN_PORT in the kyp-era Win32 build; Phase Q
      # deleted that endpoint so the wire moved to UDP here.
      - "3810:3810/udp"
    restart: unless-stopped

  # --------------------------------------------------------------
  # Net7Proxy server-side TCP listener (Phase J).
  # Binds 3801 (MASTER_SERVER_PORT) for the Westwood RSA+RC4 client
  # handshake, plus 3805 (GLOBAL_SERVER_PORT). The 9.5K LOC of original
  # client-launcher logic under proxy/ is `#ifdef WIN32`-gated and
  # compiles to nothing on Linux; the Linux build path is a thin
  # ServerManager + TcpListener that accepts connections and (today)
  # drops them after logging the peer IP. Handshake + downstream
  # dispatch is the next pass.
  # --------------------------------------------------------------
  proxy:
    build:
      # Phase R: build context is the repo root so the Dockerfile can
      # COPY common/ in addition to proxy/.
      context: .
      dockerfile: proxy/Dockerfile
    depends_on:
      # Phase K: the proxy opens connect()'d UDP sockets to "server" at
      # boot (UDPClient_linux.cpp::ResolveGameServerIP). If `server`
      # isn't a registered hostname in docker's DNS at that moment,
      # getaddrinfo() fails and the proxy falls back to its ip_addr ctor
      # arg (127.0.0.1 — its own loopback), which silently breaks both
      # the master and global UDP planes. Wait for the server container
      # to exist before starting the proxy.
      server:
        condition: service_started
    extra_hosts:
      - "local.net-7.org:127.0.0.1"
    ports:
      - "3801:3801/tcp"
      - "3805:3805/tcp"
      # Phase K: SECTOR_SERVER_PORT — second-stage connect target the
      # client hits after MasterJoin returns a ServerRedirect. Same
      # Connection ctor / handshake / framed-dispatch path as 3801/3805,
      # routed with m_ServerType=CLIENT_TO_SECTOR_SERVER.
      - "3500:3500/tcp"
    # PROXY_EXTRA_ARGS lets the launcher recipes pass extra command-line
    # flags to net7proxy without editing this file. `just play-local`
    # leaves it unset (quiet console); `just debug-local` exports
    # PROXY_EXTRA_ARGS=/OPCODES to enable LogVMessage verbose tracing of
    # every sector UDP packet for crash diagnosis. Compose substitutes the
    # value at parse time, so a change in the host env triggers a
    # container recreate on the next `up -d`.
    #
    # PROXY_S2C_DROP_ALL / PROXY_S2C_DROP: bisection knobs read by
    # UDPProxyToClient_linux.cpp's should_drop_s2c gate. Pass through
    # from the host env so `just bisect-drop-all` / `just bisect-drop
    # 0x001b,0x0025` work without editing this file.
    #
    # PROXY_S2C_HEXDUMP: per-frame hex dump of every server->client opcode
    # payload (capture-file format). Only `just debug-local` sets this;
    # play-local and the bisect-drop* recipes leave it unset so their
    # console output stays focused.
    #
    # PROXY_S2C_REPLAY: path to a binary capture-replay file (produced by
    # tools/capture-extract/). When set, the proxy substitutes each
    # server->client opcode payload with the next retail payload for that
    # opcode from the file -- used to disentangle transport bugs from
    # payload-content bugs when chasing the dock-zone-in client crash.
    # Files live under archive/replay/ and are mounted read-only into
    # /app/replay/. `just packet-replay <capture>` sets this.
    #
    # PROXY_LIVE_AVATAR_ID: optional 0xhex or decimal override for the
    # live session's avatar_id. The replay layer rewrites every 4-byte LE
    # occurrence of the capture's retail avatar_id to this value so the
    # client sees frames addressed to the avatar it actually selected.
    # When unset, the proxy lazily learns the live id from the first s2c
    # emit whose retail payload starts with the retail avatar_id (matches
    # 0x37/0x47/0x61/0xB2). Override only useful if you know the id
    # ahead of time (e.g. pre-seeded SQL).
    environment:
      - PROXY_S2C_DROP_ALL=${PROXY_S2C_DROP_ALL:-}
      - PROXY_S2C_DROP=${PROXY_S2C_DROP:-}
      - PROXY_S2C_HEXDUMP=${PROXY_S2C_HEXDUMP:-}
      - PROXY_S2C_REPLAY=${PROXY_S2C_REPLAY:-}
      - PROXY_LIVE_AVATAR_ID=${PROXY_LIVE_AVATAR_ID:-}
    volumes:
      - ./archive/replay:/app/replay:ro
    command: ["sh", "-c", "exec /app/net7proxy ${PROXY_EXTRA_ARGS:-}"]
    restart: unless-stopped

  # --------------------------------------------------------------
  # Net7SSL server-side TLS authentication listener (Phase J).
  # Binds 443 (SSL_PORT) — the Westwood SSL auth handshake the
  # client speaks first. The WIN32-only Connection/MailManager/MySQL
  # tree under login-server/Net7SSL/ is walled at source level; the
  # Linux path drives SSL_accept() inline and closes. Opcode
  # dispatch / account lookup are the next pass.
  # --------------------------------------------------------------
  login:
    build:
      # Phase R: build context is the repo root so the Dockerfile can
      # COPY common/ in addition to login-server/.
      context: .
      dockerfile: login-server/Dockerfile
    depends_on:
      # Phase N: login-server (Net7SSL) also speaks Postgres via libpqxx
      # now. See the depends_on block on the `server` service for why
      # this block was rewritten.
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    extra_hosts:
      - "local.net-7.org:127.0.0.1"
    environment:
      # LinuxAuth.cpp reads these to talk to the DB (Postgres since Phase N).
      # Renamed MYSQL_*->DB_* in the login-server/proxy MySQL-name cleanup;
      # the env-var contract is a closed loop (only set here, only read by
      # LinuxAuth's EnvOr), so the rename is a coordinated code+compose change.
      DB_HOST: "postgres:5432"
      DB_USER: "net7"
      DB_PASS: "net7"
      DB_NAME: "net7_user"
    volumes:
      # SSL_Listener.cpp reads "<g_DomainName>.cer" and "<g_DomainName>.pem"
      # from CWD; the same certs the server container uses also work here.
      - ./deploy/certs/localhost.cer:/app/localhost.cer:ro
      - ./deploy/certs/localhost.pem:/app/localhost.pem:ro
      # Phase J IPC: shares the AF_UNIX SOCK_DGRAM sockets with the server
      # container (Net7SSL writes /run/net7-ipc/net7.sock,
      # reads /run/net7-ipc/net7SSL.sock; server is the mirror).
      - net7-ipc:/run/net7-ipc
    # The login container runs as root; we use that to chmod the shared
    # /run/net7-ipc volume to 0777 before exec'ing net7ssl, so the
    # server container (running as net7:net7, uid 999) can also bind a
    # datagram socket there. Same-host trust model — see posix_ipc.h.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /run/net7-ipc
        chmod 0777 /run/net7-ipc
        exec /app/net7ssl
    ports:
      # Container binds 443 internally (the protocol-correct port). The
      # host side is remapped to 4443 so the stack works under rootless
      # docker, which forbids publishing host ports < 1024. For prod, set
      # `sysctl net.ipv4.ip_unprivileged_port_start=443` on the host and
      # change the left side to 443.
      - "4443:443/tcp"
    restart: unless-stopped

  # --------------------------------------------------------------
  # Postgres backend (Phase N: now the canonical backend; was originally
  # behind a `postgres` profile while the libpqxx port was in flight).
  # `schema-init` below applies the converted schema + seed data on first
  # boot.
  # --------------------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: net7
      POSTGRES_PASSWORD: net7
      POSTGRES_DB: net7
      # Force UTF8 encoding and the locale-independent C.UTF-8 collation
      # on initdb so the cluster (template0/template1/postgres/net7) is
      # identical across host machines regardless of the host's $LANG. The
      # `schema-init` service mirrors the same flags on the CREATE DATABASE
      # it issues for net7_user.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    # Include the client application_name (%a) in every log line. The C++
    # server tags its connections application_name=net7-server (see
    # mysqlplus.cpp), so the boot-log health guard (Smoke/BootLogHealthTests)
    # can attribute a "does not exist" error to the server's own SQL rather
    # than to ad-hoc psql / tooling sharing the stack. %q hides the session
    # fields for non-session (e.g. startup) lines.
    command:
      - "postgres"
      - "-c"
      - "log_line_prefix=%m [%p] %q%u@%d app=%a "
    ports:
      # Host 5434 -> container 5432 to dodge a developer's local
      # system Postgres on host:5432 (and a hanging rootlesskit binding
      # on :5433 observed in dev). Compose-internal traffic still uses
      # postgres:5432 regardless of the host mapping.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U net7 -d net7"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  schema-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: net7
    volumes:
      - ./db/postgres:/db:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # The C++ server connects to two databases: "net7" (game content;
        # schema.sql) and "net7_user" (accounts/avatars; seed.sql in this
        # repo's MySQL-derived dumps).
        #
        # This service is idempotent: every apply is gated on "is the
        # target table already present?". On first boot both checks miss
        # and the full ~110k-row apply runs (~minutes). On every
        # subsequent boot both checks hit and the service exits in well
        # under a second. To force a re-apply, wipe the volume:
        #   docker compose down -v   (or `just nuke-pg`)
        psql -h postgres -U net7 -d postgres -tA \
          -c "SELECT 1 FROM pg_database WHERE datname='net7_user'" \
          | grep -q 1 \
          || psql -h postgres -U net7 -d postgres -c \
               "CREATE DATABASE net7_user OWNER net7 ENCODING 'UTF8' LC_COLLATE 'C.UTF-8' LC_CTYPE 'C.UTF-8' TEMPLATE template0;"
        # net7 (game content). Probe for `item_base` — it's one of the
        # 71 tables schema.sql creates and is non-empty after a successful
        # apply.
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.item_base') IS NOT NULL" | grep -q t; then
          echo "schema-init: net7.item_base already present — skipping schema.sql"
        else
          echo "schema-init: applying /db/schema.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/schema.sql
        fi
        # net7_user (accounts). Probe for `accounts` for the same reason.
        # seed.sql is now strict-clean after the convert.sh updates
        # (varchar(0)->text, bare double->double precision, zero-date
        # defaults sentinelled, MySQL stored procs stripped because Phase
        # N inlined every CALL into the C++ libpqxx path).
        if psql -h postgres -U net7 -d net7_user -tA \
             -c "SELECT to_regclass('public.accounts') IS NOT NULL" | grep -q t; then
          echo "schema-init: net7_user.accounts already present -- skipping seed.sql"
        else
          echo "schema-init: applying /db/seed.sql -> net7_user"
          psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/seed.sql
        fi
        # Phase Y1+Y5 reference-data seed (NPC roster, factions, manufacturers,
        # item catalog, vendor inventories) -- generated by
        # tools/dataimport-jsonl/generate_seed.py from the JSONL reconstruct
        # dataset. All IDs in this seed live at or above 100000 (synth
        # range) so they can never collide with a future authoritative dump.
        # Idempotency: ON CONFLICT DO NOTHING on every INSERT, gated by a
        # canary probe on starbase_npcs.npc_Id=100000 (the first synth NPC).
        # starbase_vender_inventory rows have IDENTITY ids so they re-apply
        # cleanly only when the gate skips us; the gate is what makes this
        # safe on re-boot.
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.starbase_npcs') IS NOT NULL AND EXISTS (SELECT 1 FROM starbase_npcs WHERE \"npc_Id\" = 100000)" | grep -q t; then
          echo "schema-init: net7.starbase_npcs synth roster already present -- skipping seed_phase_y.sql"
        else
          echo "schema-init: applying /db/seed_phase_y.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y.sql
        fi
        # Phase Y4 sector-nav seed (positional navigation markers missing from
        # the runtime DB) -- generated by generate_seed_navs.py. Synth ids at
        # or above 100000; gated on the first synth sector_object (100000).
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.sector_objects') IS NOT NULL AND EXISTS (SELECT 1 FROM sector_objects WHERE sector_object_id = 100000)" | grep -q t; then
          echo "schema-init: net7.sector_objects synth navs already present -- skipping seed_phase_y_navs.sql"
        else
          echo "schema-init: applying /db/seed_phase_y_navs.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_navs.sql
        fi
        # Phase Y8 mob loot/drop seed (mob_items links present in the reconstruct
        # dataset but absent from the runtime, where both ends resolve by name) --
        # generated by generate_seed_drops.py. Payload rates are GENERATED
        # placeholders (the source has no rates); ids at or above 100000; gated on
        # the first synth row (id 100000). The seed DELETEs id>=100000 first so it
        # is safe even if the gate is bypassed.
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.mob_items') IS NOT NULL AND EXISTS (SELECT 1 FROM mob_items WHERE id = 100000)" | grep -q t; then
          echo "schema-init: net7.mob_items synth drops already present -- skipping seed_phase_y_drops.sql"
        else
          echo "schema-init: applying /db/seed_phase_y_drops.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_drops.sql
        fi
        # Phase Y9 prospecting seed (harvestable type-38 resource fields absent
        # from the runtime but present in the reconstruct dataset) -- generated
        # by generate_seed_prospecting.py. sector_objects is SHARED with Y4
        # navs, so Y9 nodes allocate from 200000 (Y4 owns [100000,100048)); the
        # seed DELETEs synth rows (sector_objects scoped to type=38) before
        # re-inserting, every INSERT is ON CONFLICT DO NOTHING. Gated on the
        # first synth prospecting node (type=38 sector_object at 200000).
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.sector_objects') IS NOT NULL AND EXISTS (SELECT 1 FROM sector_objects WHERE sector_object_id = 200000 AND type = 38)" | grep -q t; then
          echo "schema-init: net7.sector_objects synth prospecting fields already present -- skipping seed_phase_y_prospecting.sql"
        else
          echo "schema-init: applying /db/seed_phase_y_prospecting.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_prospecting.sql
        fi
        # Item effect-link backfill. The external item dataset lists item->effect
        # links absent from the runtime DB; seed_item_effects.sql adds them
        # (item_effects rows, plus any missing item_effect_container gate and any
        # minted item_effect_base for effect keys we lack). CONFIRMED magnitudes
        # come from the source; slots the source does not carry are filled with
        # deterministic in-range values (see the file header + the generator's
        # --report). Minted bases start at EffectID 240; gated on the first one.
        # The seed is internally idempotent (every INSERT is NOT EXISTS-guarded).
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.item_effect_base') IS NOT NULL AND EXISTS (SELECT 1 FROM item_effect_base WHERE \"EffectID\" = 240)" | grep -q t; then
          echo "schema-init: net7.item_effect_base backfill already present -- skipping seed_item_effects.sql"
        else
          echo "schema-init: applying /db/seed_item_effects.sql -> net7"
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_item_effects.sql
        fi
        # Sequence sync (ALWAYS, idempotent). schema.sql and the Phase Y
        # seeds bulk-load identity columns with explicit ids without
        # advancing their backing sequences, so every IDENTITY sequence is
        # left at 1 while data occupies ids up to ~200528. Until this runs,
        # any INSERT ... RETURNING that lets the identity allocate (the
        # editor "new row" path) collides with existing rows. See
        # db/postgres/sync_sequences.sql.
        echo "schema-init: syncing identity sequences -> net7"
        psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/sync_sequences.sql
        echo "schema-init: done"
    restart: "no"

  pgadmin:
    profiles: ["dev-tools-postgres"]
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@localhost
      PGADMIN_DEFAULT_PASSWORD: net7
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8080:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  mysqldata:
  pgdata:
  # Phase J IPC: shared AF_UNIX SOCK_DGRAM socket directory between the
  # server and login containers. Replaces the Win32 mailslot pair.
  net7-ipc:
