<?xml version="1.0" encoding="utf-8" ?>
<configuration>
  <configSections>
    <section name="launchNet7" type="LaunchNet7.Configuration.LauncherConfigurationSection, LaunchNet7" />
  </configSections>

  <!--
    Windows standalone-package config (shipped by `just package-client-windows`).

    This is NOT the dev config. The dev `LaunchNet7.cfg` points at localhost /
    the docker stack; this one ships in the end-user Windows zip and defaults to
    the public server. Do not copy localhost entries in here.

    The <host hostname="..."/> value is the *upstream* the local proxy forwards
    to. The Server box in the launcher is editable -- a user can type their own
    server here; this entry is only the default. A scheme (https://) is tolerated
    and stripped before DNS/TCP resolution. Auth port defaults to 443 (the
    protocol-correct TLS port the login server binds); the dev stack's 4443 is a
    docker host-side remap and has no place in the shipped package.
  -->
  <launchNet7 defaultWebsite="">

    <servers>

      <server name="Net7MP" displayName="Multi-Player">
        <host hostname="https://enb.sigsegv.land" />
      </server>

    </servers>

  </launchNet7>

</configuration>
