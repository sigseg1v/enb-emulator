name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  lint-plans:
    name: lint-plans
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Plans directory + master status table exist
        run: |
          set -euo pipefail
          test -d plans
          ls plans/00-master.md plans/01-phase-a-merge.md plans/02-phase-b-linux-server.md
          grep -q "^## Status table" plans/00-master.md

  check-no-mojibake:
    name: check-no-mojibake (license-header guard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No U+FFFD replacement chars in tracked source
        run: bash tools/check_no_mojibake.sh

  sql-injection-audit:
    name: sql-injection-audit (parameterised-query gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No dynamic SQL string-building in server-native code
        # Phase N drove the server-native sprintf/strcat-SQL surface to
        # zero; every DB call goes through the wrapper's parameterised
        # path. This gate fails the build if a new injection site lands.
        # #ifdef WIN32-walled blocks (dead on Linux) are exempt by the
        # script. Baseline is 0, so a non-zero exit means a regression.
        run: bash tools/sql_injection_audit.sh

  cmake-configure:
    name: cmake-configure (server, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            libssl-dev liblua5.4-dev liblua5.4-0 \
            libtinyxml-dev libcrypto++-dev \
            libpq-dev libpqxx-dev libsodium-dev
      - name: Configure
        run: cmake -S server -B build/server -G Ninja
      - name: Upload CMake logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-configure-logs-${{ matrix.os }}
          path: |
            build/server/CMakeFiles/CMakeOutput.log
            build/server/CMakeFiles/CMakeError.log
          if-no-files-found: ignore

  cmake-build:
    name: cmake-build (server, ${{ matrix.os }})
    needs: cmake-configure
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config \
            libssl-dev liblua5.4-dev liblua5.4-0 \
            libtinyxml-dev libcrypto++-dev \
            libpq-dev libpqxx-dev libsodium-dev
      - name: Configure
        run: cmake -S server -B build/server -G Ninja
      - name: Build (best-effort; captures BUILD_ERRORS.md + WARNINGS.txt)
        run: |
          set +e
          cmake --build build/server -j"$(nproc)" 2>&1 | tee server/BUILD_ERRORS.md
          echo "build exit: $?"
          # Phase F continuation: extract just the -W warnings as a
          # separate artifact so the count + distribution is trackable
          # over time without trawling the full build log.
          grep -E "warning: .*\[-W" server/BUILD_ERRORS.md > server/WARNINGS.txt || true
          wc -l server/WARNINGS.txt
      - name: Upload BUILD_ERRORS.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-build-errors-${{ matrix.os }}
          path: server/BUILD_ERRORS.md
          if-no-files-found: ignore
      - name: Upload WARNINGS.txt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-warnings-${{ matrix.os }}
          path: server/WARNINGS.txt
          if-no-files-found: ignore

  db-schema:
    name: db-schema (postgres apply)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: net7
          POSTGRES_PASSWORD: net7
          POSTGRES_DB: net7
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U net7 -d net7"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Convert MySQL schema -> Postgres
        run: bash db/postgres/convert.sh
      - name: Apply schema
        env:
          PGPASSWORD: net7
        run: |
          psql -h 127.0.0.1 -U net7 -d net7 -v ON_ERROR_STOP=1 \
               -f db/postgres/schema.sql

  dotnet-build:
    name: dotnet-build (tools)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build tool suite
        run: dotnet build tools/FreyaTools.slnx

  ctest:
    name: ctest (gtest harness)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: net7
          POSTGRES_PASSWORD: net7
          POSTGRES_DB: net7
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U net7 -d net7"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config libpq-dev libssl-dev
      - name: Configure
        run: cmake -S tests/server -B build/tests -G Ninja
      - name: Build
        run: cmake --build build/tests -j"$(nproc)"
      - name: Test
        env:
          NET7_TEST_DB_DSN: "host=127.0.0.1 user=net7 password=net7 dbname=net7"
        run: ctest --test-dir build/tests --output-on-failure

  installer-shellcheck:
    name: installer-shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
      - name: Lint installer
        run: shellcheck client/linux-installer/install-enb-linux.sh

  integration-test:
    name: integration-test (live proxy handshake)
    runs-on: ubuntu-24.04
    needs: ctest
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config libssl-dev
      - name: Build FreyaProxy docker image
        # Dockerfile COPYs from `proxy/` and `common/`, so the build
        # context must be the repo root, not `proxy/` itself.
        run: docker build -t enb-proxy:ci -f proxy/Dockerfile .
      - name: Run proxy detached
        # This job runs the proxy in isolation with NO server behind it, so the
        # proxy<->server UDP leg has nothing to encrypt to. The Phase-AH DTLS
        # default is fail-closed (the proxy FATAL-exits at startup unless it has
        # a server cert hostname to verify), so opt this isolated proxy into
        # plaintext UDP -- the same opt-out the dev docker-compose stack uses.
        run: |
          docker run -d --name net7proxy-ci \
            -p 3801:3801 -p 3805:3805 -p 3500:3500 \
            -e NET7_DTLS_ALLOW_PLAINTEXT=i-accept-unencrypted-udp \
            enb-proxy:ci
      - name: Wait for proxy on tcp/3801
        run: |
          set -e
          for i in $(seq 1 30); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/3801' 2>/dev/null; then
              echo "proxy ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "proxy never came up; logs:"
          docker logs net7proxy-ci
          exit 1
      - name: Build tests
        run: |
          cmake -S tests/server -B build/tests -G Ninja
          cmake --build build/tests --target handshake_live_test replay_test -j"$(nproc)"
      - name: Run live ctest (proxy-only -- handshake + send path)
        # NOTE: This job runs the proxy in isolation, with no MVAS / sector
        # server behind it. Replay.LivePostHandshakeReplay verifies the Net7
        # handshake completes and the encrypted post-handshake send path is
        # accepted (and that the proxy does not drop the connection). It does
        # NOT verify a MasterJoin -> ServerRedirect round-trip: the captured
        # Master_Join carries a stale retail avatar id with no live Player, so
        # no MVAS will confirm it and the only proxy reply is the ~150s
        # cold-start fallback. The session-backed round-trip is verified with
        # a real session by the cli-integration-test xUnit suite below.
        env:
          NET7_TEST_PROXY_HOST: 127.0.0.1
          NET7_TEST_PROXY_PORT: "3801"
        run: ctest --test-dir build/tests --output-on-failure -R 'HandshakeDriver|Replay'
      - name: Proxy logs (always)
        if: always()
        run: docker logs net7proxy-ci || true
      - name: Stop proxy
        if: always()
        run: docker rm -f net7proxy-ci || true

  # The integration suite cannot parallelise in-process: it shares one
  # ServerCollection / one docker-compose stack, and the proxy is
  # single-client. So we shard it across PARALLEL jobs instead -- each
  # shard gets its own stack and runs a disjoint slice of the suite.
  #
  # The slice is computed at runtime from `dotnet test --list-tests`
  # (see tools/ci/integration_shard_filter.py), NOT a hand-maintained
  # name list: a newly added test class is discovered automatically and
  # lands in exactly one shard. The `cli-integration-coverage` job below
  # is the guard that proves every class is covered exactly once, so a
  # new test can never silently fall outside CI.
  #
  # SHARD COUNT lives in two places that MUST agree: the matrix list
  # `shard: [1, 2, 3]` and `SHARDS: "3"`. Bump both to rebalance.
  cli-integration-test:
    name: cli-integration-test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # One shard runs ~1/3 of the suite (~8 min) + stack bring-up (~3 min)
    # + the proxy-recycle self-heal. 25 min covers a shard with margin;
    # the un-sharded job needed 45 and still timed out.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARDS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build CliClient.IntegrationTests
        run: |
          dotnet build tests/integration/CliClient.IntegrationTests/CliClient.IntegrationTests.csproj \
            --configuration Debug
      - name: Compute this shard's test filter (runtime discovery)
        # `--list-tests` only enumerates; it does not run the suite or
        # touch the stack, so this is safe before the stack is up. The
        # filter is derived from discovery, never a hardcoded name list.
        run: |
          dotnet test tests/integration/CliClient.IntegrationTests/CliClient.IntegrationTests.csproj \
            --no-build --list-tests > /tmp/alltests.txt
          FILTER="$(python3 tools/ci/integration_shard_filter.py \
            --list-file /tmp/alltests.txt --shards "$SHARDS" --shard ${{ matrix.shard }})"
          echo "Shard ${{ matrix.shard }}/${SHARDS} classes:"
          echo "$FILTER" | tr '|' '\n'
          # Persist for the run step (the filter can be long; use a file).
          printf '%s' "$FILTER" > /tmp/shard_filter.txt
      - name: Generate self-signed dev TLS cert (justfile gen-certs)
        run: |
          mkdir -p deploy/certs
          openssl req -x509 -newkey rsa:2048 -days 365 -nodes \
            -subj "/CN=localhost/O=Earth-and-Beyond Emulator Dev/C=US" \
            -addext "subjectAltName=DNS:localhost,DNS:local.net-7.org,IP:127.0.0.1" \
            -keyout deploy/certs/localhost.pem \
            -out    deploy/certs/localhost.cer
      - name: Bring up docker-compose stack (postgres + login + proxy + server)
        run: |
          docker compose up -d --wait postgres login proxy server
          docker compose ps
      - name: Build + run C++ ctest with a real MVAS behind the proxy
        # Proxy<->MVAS handoff smoke. Runs on shard 1 only -- it is not a
        # function of the test slice, so running it in every shard would
        # just triplicate the same check. The full stack is up (postgres +
        # login + proxy + server) so the proxy's UDPConnection::
        # SendMasterLogin genuinely reaches a live MVAS, exercising the
        # real proxy->MVAS UDP handoff, not just the socket-level timeout
        # the proxy-only `integration-test` job hits. The replayed
        # Master_Join carries a stale retail avatar id (no live Player), so
        # no ServerRedirect comes back inside the timeout; the test
        # verifies the handshake + send path complete and the proxy keeps
        # the connection open. The session-backed MasterJoin ->
        # ServerRedirect round-trip is verified with a REAL logged-in
        # avatar by the xUnit suite (Opcodes/MasterJoinTests.cs).
        if: matrix.shard == 1
        env:
          NET7_TEST_PROXY_HOST: 127.0.0.1
          NET7_TEST_PROXY_PORT: "3801"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build pkg-config libssl-dev
          cmake -S tests/server -B build/tests -G Ninja
          cmake --build build/tests --target handshake_live_test replay_test -j"$(nproc)"
          ctest --test-dir build/tests --output-on-failure -R 'Replay\.LivePostHandshakeReplay'
      - name: Run integration suite (shard ${{ matrix.shard }}/3)
        env:
          # ServerFixture owns the lifecycle when we DON'T pass this.
          # We brought the stack up explicitly above so we DO set it --
          # fixture skips its own `compose up`/`down -v` and reuses
          # ours. This way the ServerFixture's `down -v` never wipes
          # the stack mid-job; we tear it down ourselves in a final
          # always-runs step that also collects logs.
          CLI_INTEGRATION_SKIP_COMPOSE: "1"
        run: |
          dotnet test tests/integration/CliClient.IntegrationTests/CliClient.IntegrationTests.csproj \
            --no-build \
            --filter "$(cat /tmp/shard_filter.txt)" \
            --logger "trx;LogFileName=cli-integration-shard${{ matrix.shard }}.trx" \
            --logger "console;verbosity=normal" \
            --results-directory test-results/
      - name: Upload TRX artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-integration-trx-${{ matrix.shard }}
          path: test-results/**/*.trx
          if-no-files-found: warn
      - name: Stack logs on failure
        if: failure()
        run: |
          echo "=== postgres ==="; docker compose logs postgres || true
          echo "=== login ===";  docker compose logs login  || true
          echo "=== proxy ===";  docker compose logs proxy  || true
          echo "=== server ==="; docker compose logs server || true
      - name: Tear down docker-compose stack
        if: always()
        run: docker compose down -v || true

  # Fast guard (no docker): proves the shard partition covers every
  # discovered test class exactly once. If a new test class somehow fails
  # to land in a shard -- or lands in two -- this job goes red, so the
  # sharding can never silently drop a test from CI.
  cli-integration-coverage:
    name: cli-integration-coverage (shard partition guard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build CliClient.IntegrationTests
        run: |
          dotnet build tests/integration/CliClient.IntegrationTests/CliClient.IntegrationTests.csproj \
            --configuration Debug
      - name: Verify every test class is covered exactly once
        # The --shards value MUST match cli-integration-test's matrix.
        run: |
          dotnet test tests/integration/CliClient.IntegrationTests/CliClient.IntegrationTests.csproj \
            --no-build --list-tests > /tmp/alltests.txt
          python3 tools/ci/integration_shard_filter.py \
            --list-file /tmp/alltests.txt --shards 3 --check
