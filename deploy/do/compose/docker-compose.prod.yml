# Production stack for the DigitalOcean droplet.
#
# Differences from the repo-root docker-compose.yml (the dev stack):
#   - images are PULLED from the private DO registry, not built here
#     (the droplet does not have the source tree);
#   - login publishes 443:443 (rootful docker on the droplet can bind <1024;
#     the dev stack uses 4443 only to satisfy rootless docker);
#   - postgres is NOT published to the internet (internal to the compose net);
#   - no mysql-legacy / pgadmin / dev replay+bisect knobs.
#
# The proxy is NOT here: it is a per-client, single-connection bridge that runs
# on each player's own (Windows) machine, so it is never deployed server-side.
# The server-side services live in ONE registry repository ("enb") as per-service
# tags -- enb:server-<v>, enb:login-<v>, enb:status-notifier-<v> -- so the stack
# fits DOCR's free Starter tier (1 repository). IMAGE_TAG is the version SUFFIX:
# 'latest' (default) or a pinned 'vN' (e.g. v7); all are always built and bumped
# together, so a single 'vN' pins a coherent release across the whole stack.
#
# It is driven from /opt/enb on the droplet with an .env that defines
# REGISTRY, IMAGE_TAG, DOMAIN and COMPOSE_PROJECT_NAME (written by
# Update-Stack.ps1). Run as:
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
name: ${COMPOSE_PROJECT_NAME:-freya}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: net7
      POSTGRES_PASSWORD: net7
      POSTGRES_DB: net7
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    command:
      - "postgres"
      - "-c"
      - "log_line_prefix=%m [%p] %q%u@%d app=%a "
    # Internal only -- never expose the database to the internet.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U net7 -d net7"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Idempotent schema/seed apply. KEEP THIS BLOCK IN SYNC with the schema-init
  # service in the repo-root docker-compose.yml -- it is the same gated apply
  # (every step is "is the target table already present?"), so first boot runs
  # the full load and every later boot exits in under a second.
  schema-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: net7
    volumes:
      - ./db:/db:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -h postgres -U net7 -d postgres -tA \
          -c "SELECT 1 FROM pg_database WHERE datname='net7_user'" \
          | grep -q 1 \
          || psql -h postgres -U net7 -d postgres -c \
               "CREATE DATABASE net7_user OWNER net7 ENCODING 'UTF8' LC_COLLATE 'C.UTF-8' LC_CTYPE 'C.UTF-8' TEMPLATE template0;"
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.item_base') IS NOT NULL" | grep -q t; then
          echo "schema-init: net7.item_base present -- skipping schema.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/schema.sql
        fi
        if psql -h postgres -U net7 -d net7_user -tA \
             -c "SELECT to_regclass('public.accounts') IS NOT NULL" | grep -q t; then
          echo "schema-init: net7_user.accounts present -- skipping seed.sql"
        else
          psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/seed.sql
        fi
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.starbase_npcs') IS NOT NULL AND EXISTS (SELECT 1 FROM starbase_npcs WHERE \"npc_Id\" = 100000)" | grep -q t; then
          echo "schema-init: Phase Y roster present -- skipping seed_phase_y.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y.sql
        fi
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.sector_objects') IS NOT NULL AND EXISTS (SELECT 1 FROM sector_objects WHERE sector_object_id = 100000)" | grep -q t; then
          echo "schema-init: Phase Y navs present -- skipping seed_phase_y_navs.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_navs.sql
        fi
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.mob_items') IS NOT NULL AND EXISTS (SELECT 1 FROM mob_items WHERE id = 100000)" | grep -q t; then
          echo "schema-init: Phase Y drops present -- skipping seed_phase_y_drops.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_drops.sql
        fi
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.sector_objects') IS NOT NULL AND EXISTS (SELECT 1 FROM sector_objects WHERE sector_object_id = 200000 AND type = 38)" | grep -q t; then
          echo "schema-init: Phase Y prospecting present -- skipping seed_phase_y_prospecting.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_phase_y_prospecting.sql
        fi
        if psql -h postgres -U net7 -d net7 -tA \
             -c "SELECT to_regclass('public.item_effect_base') IS NOT NULL AND EXISTS (SELECT 1 FROM item_effect_base WHERE \"EffectID\" = 240)" | grep -q t; then
          echo "schema-init: item effect backfill present -- skipping seed_item_effects.sql"
        else
          psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/seed_item_effects.sql
        fi
        # AH-9 ticket-handoff table. CREATE TABLE IF NOT EXISTS is idempotent
        # and, unlike the seed.sql block above, this is NOT gated on the accounts
        # probe -- it must land on PRE-EXISTING volumes too. The table is new, so
        # an old prod volume already has `accounts` and a gated apply would skip
        # it, leaving the game server's ticket validation failing closed for every
        # login (G_ERROR_TICKET_INVALID). See db/postgres/login_ticket.sql.
        echo "schema-init: applying /db/login_ticket.sql -> net7_user"
        psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/login_ticket.sql
        # Phase AM external-status outbox table (net7_user). UNCONDITIONAL, same
        # rationale as login_ticket: new table, must land on pre-existing prod
        # volumes too. See db/postgres/external_status_events.sql.
        echo "schema-init: applying /db/external_status_events.sql -> net7_user"
        psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/external_status_events.sql
        # Phase AM-8 server_status heartbeat singleton (net7_user). UNCONDITIONAL,
        # same rationale: new table, must land on pre-existing prod volumes too.
        # See db/postgres/server_status.sql.
        echo "schema-init: applying /db/server_status.sql -> net7_user"
        psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/server_status.sql
        # Phase AM per-kind relay on/off switches (net7_user). UNCONDITIONAL, same
        # rationale: new relation the sidecar reads at drain time and the /notify
        # bot command writes. CREATE TABLE IF NOT EXISTS + seed ON CONFLICT DO
        # NOTHING are idempotent. See db/postgres/status_notification_settings.sql.
        echo "schema-init: applying /db/status_notification_settings.sql -> net7_user"
        psql -h postgres -U net7 -d net7_user -v ON_ERROR_STOP=1 -f /db/status_notification_settings.sql
        echo "schema-init: syncing identity sequences -> net7"
        psql -h postgres -U net7 -d net7 -v ON_ERROR_STOP=1 -f /db/sync_sequences.sql
        echo "schema-init: done"
    restart: "no"

  server:
    image: ${REGISTRY}/enb:server-${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
      login:
        condition: service_started
    environment:
      TZ: UTC
      # Phase AM external-status events. Set NET7_EXTERNAL_STATUS_ENABLED=1 in the
      # droplet .env to enqueue login/logout/level-up/broadcast/server-start
      # events for the status-notifier sidecar. Default empty = off (the server's
      # EmitExternalStatusEvent no-ops and writes nothing). See deploy README.
      NET7_EXTERNAL_STATUS_ENABLED: "${NET7_EXTERNAL_STATUS_ENABLED:-}"
    # Resolve our own domain to loopback inside the container, mirroring the
    # dev stack's local.net-7.org remap. See the README "remote addressing"
    # caveat -- this is the load-bearing UNVERIFIED bit for remote play.
    extra_hosts:
      - "${DOMAIN}:127.0.0.1"
    volumes:
      - ./Net7Config.cfg:/app/Net7Config.cfg:ro
      - ./certs/${DOMAIN}.cer:/app/${DOMAIN}.cer:ro
      - ./certs/${DOMAIN}.pem:/app/${DOMAIN}.pem:ro
      - ./server-data:/database:ro
      - net7-ipc:/run/net7-ipc
    ports:
      - "3501-3800:3501-3800/udp"
      - "3806:3806/udp"
      - "3808:3808/udp"
      - "3810:3810/udp"
    restart: unless-stopped

  login:
    image: ${REGISTRY}/enb:login-${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    extra_hosts:
      - "${DOMAIN}:127.0.0.1"
    environment:
      DB_HOST: "postgres:5432"
      DB_USER: "net7"
      DB_PASS: "net7"
      DB_NAME: "net7_user"
      # Phase AN launcher self-update. /updateCheck answers from a manifest.json
      # the login server GETs from CloudFront at startup; the launcher downloads
      # changed files from NET7_PATCHER_DL_BASE. Both are blank unless the patcher
      # infra is configured (ENB_PATCHER_PRIVATE_S3_BUCKET set) -- with them empty
      # the manifest never loads and /updateCheck fail-closes (reports DOWN), which
      # is harmless until the delivery path exists. See deploy README.
      NET7_PATCHER_MANIFEST_URL: "${NET7_PATCHER_MANIFEST_URL:-}"
      NET7_PATCHER_DL_BASE: "${NET7_PATCHER_DL_BASE:-}"
    volumes:
      # net7ssl hard-codes g_DomainName="localhost" (login-server/Net7SSL/
      # Net7SSL.cpp:39) and never reads Net7Config.cfg, so SSL_Listener always
      # looks for "localhost.cer"/"localhost.pem" regardless of DOMAIN. Present
      # the real (CN=${DOMAIN}) cert under that fixed name -- the filename is
      # arbitrary; the client validates the cert's CN against the host it dialed.
      - ./certs/${DOMAIN}.cer:/app/localhost.cer:ro
      - ./certs/${DOMAIN}.pem:/app/localhost.pem:ro
      - net7-ipc:/run/net7-ipc
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /run/net7-ipc
        chmod 0777 /run/net7-ipc
        exec /app/net7ssl
    # Rootful docker on the droplet binds the protocol-correct 443 directly.
    ports:
      - "443:443/tcp"
    restart: unless-stopped

  # Phase AM status-notifier sidecar. Relays the external_status_events outbox
  # into a Discord channel through the bot, and serves the `/status` + admin-only
  # `/notify` slash commands. Talks ONLY to Postgres (net7_user) + outbound
  # HTTPS/websocket -- no game ports, no inbound trust. Like server/login, the
  # image is PULLED from the registry (the droplet has no source tree); the
  # build/push pipeline tags it enb:status-notifier-<v> in the same "enb" repo.
  # Default-off: with an empty DISCORD_BOT_TOKEN the sidecar idles. Set the token
  # (a SECRET) + STATUS_CHANNEL_ID in the droplet .env to enable delivery,
  # alongside NET7_EXTERNAL_STATUS_ENABLED=1 on the server.
  status-notifier:
    image: ${REGISTRY}/enb:status-notifier-${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: "postgres:5432"
      DB_USER: "net7"
      DB_PASS: "net7"
      DB_NAME: "net7_user"
      # SECRET from the droplet .env, never committed. Empty => the whole sidecar
      # idles (no bot, no relay). DISCORD_GUILD_ID is optional (registers the
      # commands to one guild for instant availability; empty registers globally).
      # Needs NET7_EXTERNAL_STATUS_ENABLED=1 on the server for the heartbeat that
      # powers uptime/sector counts.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:-}"
      # The channel the relay posts each event line into. Empty => the bot still
      # serves /status + /notify but the relay is idle (no target channel).
      STATUS_CHANNEL_ID: "${STATUS_CHANNEL_ID:-}"
      # Delivered outbox rows older than this many days are swept hourly (0 off).
      STATUS_RETENTION_DAYS: "${STATUS_RETENTION_DAYS:-7}"
    restart: unless-stopped

  # Phase AP db-backup sidecar. Dumps net7 + net7_user hourly with `pg_dump -Fc`
  # and rolls them into a PRIVATE S3 bucket (24 hourly + 7d of 6-hourly, pruned
  # by count). Read-only DB consumer; talks only to Postgres + one S3 bucket via
  # a BUCKET-SCOPED IAM token. Like the other sidecars the image is PULLED from
  # the registry. Default-off: an empty BACKUP_S3_BUCKET idles the loop. Enable
  # by setting BACKUP_S3_BUCKET + BACKUP_AWS_* (the scoped token terraform
  # emitted) in the droplet .env -- Update-Stack.ps1 threads them through.
  db-backup:
    image: ${REGISTRY}/enb:db-backup-${IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: "postgres:5432"
      DB_USER: "net7"
      DB_PASS: "net7"
      BACKUP_DATABASES: "net7 net7_user"
      # Empty bucket => the sidecar idles. AWS_* are the bucket-scoped IAM token
      # (SECRET) from the droplet .env, never committed.
      BACKUP_S3_BUCKET: "${BACKUP_S3_BUCKET:-}"
      BACKUP_S3_ENDPOINT: "${BACKUP_S3_ENDPOINT:-}"
      AWS_ACCESS_KEY_ID: "${BACKUP_AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${BACKUP_AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${BACKUP_AWS_REGION:-us-east-1}"
    restart: unless-stopped

volumes:
  # pgdata is bound to a directory on the durable DigitalOcean block volume that
  # cloud-init mounts at /mnt/enb-data, so the database survives droplet
  # replacement (a replace wipes the droplet's own disk, not the attached
  # volume). The block volume is created + attached by terraform
  # (digitalocean_volume.pgdata, var.manage_db_volume); cloud-init's
  # mount-data-volume.sh formats-once + mounts it and ensures the pgdata subdir.
  # If you ever run WITHOUT a managed volume, /mnt/enb-data/pgdata simply lives
  # on the root disk (cloud-init still mkdir's it) -- functional, not durable.
  pgdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/enb-data/pgdata
  net7-ipc:
