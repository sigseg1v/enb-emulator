# Production Net7Config.cfg TEMPLATE.
#
# __DOMAIN__ and __INTERNAL_IP__ are substituted by scripts/Update-Stack.ps1
# at deploy time (__DOMAIN__ <- DOMAIN, __INTERNAL_IP__ <- the reserved IP from
# terraform). Do not hardcode a real IP here -- the placeholder is filled per
# deploy so no address is committed.
#
# CAVEAT (see deploy/do/README.md "Remote addressing"): internal_ip is the
# address the server advertises to clients during the in-game handoff. Setting
# it to the public reserved IP is the most-likely-correct value for remote
# play, but it is UNVERIFIED against the real Win32 client. Confirm before
# trusting a public deploy.
domain=__DOMAIN__
internal_ip=__INTERNAL_IP__
mysql_user=net7
mysql_pass=net7
mysql_host=postgres:5432
mysql_db=net7
ticket_user=net7
ticket_pass=net7
ticket_host=postgres:5432
ticket_db=net7_user
galaxy_name=Andromeda
use_dase=0
beta_mode=0
